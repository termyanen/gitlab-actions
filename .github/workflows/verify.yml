name: Verify extension

on:
  workflow_call:

permissions:
  contents: read

jobs:
  node-compatibility:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: npm audit --audit-level=moderate
      - name: Verify generated website
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/python" -m pip install --require-hashes -r docs/requirements.txt
          "$RUNNER_TEMP/docs-venv/bin/python" docs/build_pages.py
          git diff --exit-code -- docs/review-guide.html docs/privacy.html docs/CHANGELOG.md docs/CHANGELOG_RU.md
      - run: npm run check
      - name: Build zip
        run: |
          node scripts/package.mjs extension.zip
      - name: Retain tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-package
          path: extension.zip
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain build reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-reports
          path: .reports/*.json
          include-hidden-files: true
          retention-days: 14

  browser:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-package
      - name: Unpack the tested package
        run: unzip -q extension.zip -d dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: node scripts/profile-runtime.mjs --check
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-reports
          path: |
            test-results/
            .reports/runtime-performance.json
          include-hidden-files: true
          retention-days: 14
