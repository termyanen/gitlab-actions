<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #333; margin: 0 auto; }
    body.fullpage { width: 100%; max-width: 480px; padding: 24px; }
    h3 { margin: 0 0 14px; font-size: 15px; }
    h4 { margin: 14px 0 8px; font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .hint { font-size: 11px; color: #888; margin-top: 2px; }
    .sep { border-top: 1px solid #eee; margin: 12px 0; }
    button { width: 100%; padding: 8px; background: #1f75cb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-top: 10px; }
    button:hover { background: #1a68b3; }
    .status { position: fixed; top: 0; left: 0; right: 0; padding: 6px 0; font-size: 12px; font-weight: 600; text-align: center; display: none; z-index: 9999; transition: opacity 0.3s; }
    .status.saved { background: #28a745; color: #fff; }
    .status.unsaved { background: #e67e22; color: #fff; }

    /* Tabs */
    .tabs { display: flex; gap: 0; border-bottom: 2px solid #eee; margin-bottom: 12px; }
    .tab { padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 500; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
    .tab:hover { color: #333; }
    .tab.active { color: #1f75cb; border-bottom-color: #1f75cb; }
    .tab .tab-remove { color: #d00; font-size: 14px; margin-left: 4px; }
    .tab .tab-remove:hover { color: #a00; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .btn-item { display: flex; align-items: center; gap: 4px; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
    .btn-item:last-child { border-bottom: none; }
    .btn-item input[type="checkbox"] { cursor: pointer; flex-shrink: 0; }
    .btn-item .btn-label { flex: 1; font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-item .btn-label.custom-label { color: #1f75cb; }
    .btn-arrows { display: flex; flex-direction: column; gap: 0; flex-shrink: 0; }
    .btn-arrows span { cursor: pointer; color: #999; font-size: 10px; line-height: 1; padding: 0 2px; user-select: none; }
    .btn-arrows span:hover { color: #333; }
    .btn-arrows span.disabled { visibility: hidden; }
    .btn-drag-handle { cursor: grab; color: #bbb; font-size: 14px; padding: 0 4px; user-select: none; flex-shrink: 0; }
    .btn-drag-handle:hover { color: #666; }
    .btn-item.dragging { opacity: 0.3; }
    .btn-item.drag-over { box-shadow: 0 -2px 0 0 #1f75cb inset; background: #f0f8ff; }

    .field { margin-bottom: 10px; }
    .field label { display: block; margin-bottom: 3px; font-weight: 500; }
    .field input { width: 100%; padding: 5px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
    .toggle { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .toggle label { flex: 1; cursor: pointer; }
    .toggle input { cursor: pointer; }
    .toggle.sub-toggle { padding-left: 24px; }

    .custom-job { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; }
    .custom-job input { flex: 1; padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    .custom-job .remove-btn, .jira-quick-action .remove-btn { background: none; border: none; color: #d00; cursor: pointer; font-size: 16px; padding: 0 4px; margin: 0; width: auto; }
    .custom-job .remove-btn:hover, .jira-quick-action .remove-btn:hover { color: #a00; }
    .add-btn { background: #f0f0f0; color: #333; border: 1px dashed #ccc; margin-top: 6px; }
    .add-btn:hover { background: #e8e8e8; }
    .jira-quick-action { margin-top: 6px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
    .jira-quick-action input { padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; box-sizing: border-box; width: 100%; }
    .jqa-row { display: flex; gap: 6px; align-items: center; }
    .jqa-row + .jqa-row { margin-top: 4px; }
    .jqa-row input { flex: 1; }
    .quick-comment-row { margin-top: 6px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
    .quick-comment-row input { padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; box-sizing: border-box; width: 100%; }
    .quick-comment-row .remove-btn, .cherry-pick-branch-row .remove-btn { background: none; border: none; color: #d00; cursor: pointer; font-size: 16px; padding: 0 4px; margin: 0; width: auto; }
    .quick-comment-row .remove-btn:hover, .cherry-pick-branch-row .remove-btn:hover { color: #a00; }
    .jqa-field { flex: 1; }
    .jqa-label { font-size: 10px; color: #888; display: block; margin-bottom: 2px; }

    .current-project { font-size: 11px; color: #1f75cb; margin-bottom: 8px; font-weight: 500; }
    .how-link { font-size: 11px; color: #1f75cb; text-decoration: none; font-weight: 400; margin-left: 8px; }
    .how-link:hover { text-decoration: underline; }

    .update-banner { background: #f0f7ff; border: 1px solid #cce0f5; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.5; position: relative; display: none; }
    .update-banner .update-version { font-weight: 600; color: #1f75cb; }
    .update-banner a { color: #1f75cb; text-decoration: none; }
    .update-banner a:hover { text-decoration: underline; }
    .update-banner .update-close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: #999; cursor: pointer; font-size: 16px; padding: 0; margin: 0; width: auto; line-height: 1; }
    .update-banner .update-close:hover { color: #666; }
    .update-banner .update-review { display: block; margin-top: 6px; color: #666; }
    .update-banner .update-review a { color: #e67e22; }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #ddd; }
      h4 { color: #aaa; }
      .hint { color: #888; }
      .sep { border-top-color: #333; }
      .tabs { border-bottom-color: #333; }
      .tab { color: #aaa; }
      .tab:hover { color: #ddd; }
      .tab.active { color: #6cb2f7; border-bottom-color: #6cb2f7; }
      .btn-item { border-bottom-color: #333; }
      .btn-item .btn-label.custom-label { color: #6cb2f7; }
      .btn-arrows span { color: #666; }
      .btn-arrows span:hover { color: #ddd; }
      .btn-drag-handle { color: #555; }
      .btn-drag-handle:hover { color: #aaa; }
      .btn-item.drag-over { box-shadow: 0 -2px 0 0 #6cb2f7 inset; background: #252d38; }
      .field input { background: #2a2a2a; border-color: #444; color: #ddd; }
      .field input::placeholder { color: #666; }
      .custom-job input { background: #2a2a2a; border-color: #444; color: #ddd; }
      .jira-quick-action { background: #252525; border-color: #444; }
      .jira-quick-action input { background: #2a2a2a; border-color: #444; color: #ddd; }
      .jira-quick-action input::placeholder { color: #666; }
      .quick-comment-row { background: #252525; border-color: #444; }
      .quick-comment-row input { background: #2a2a2a; border-color: #444; color: #ddd; }
      .quick-comment-row input::placeholder { color: #666; }
      .jqa-label { color: #777; }
      button { background: #2d6cb4; }
      button:hover { background: #3a7fd4; }
      .add-btn { background: #2a2a2a; color: #ddd; border-color: #555; }
      .add-btn:hover { background: #333; }
      .current-project { color: #6cb2f7; }
      .how-link { color: #6cb2f7; }
      .status.saved { background: #2ea043; }
      .status.unsaved { background: #b35c14; }
      select { background: #2a2a2a !important; border-color: #444 !important; color: #ddd !important; }
      .update-banner { background: #1a2332; border-color: #2d4a6f; }
      .update-banner .update-version { color: #6cb2f7; }
      .update-banner a { color: #6cb2f7; }
      .update-banner .update-close { color: #666; }
      .update-banner .update-close:hover { color: #aaa; }
      .update-banner .update-review { color: #aaa; }
      .update-banner .update-review a { color: #e6a04c; }
    }
  </style>
</head>
<body>
  <h3 id="popupTitle">GitLab MR Actions <a href="welcome.html" target="_blank" class="how-link" id="howLink">How it works</a></h3>

  <div class="update-banner" id="updateBanner"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="default">Default</div>
  </div>
  <div id="currentProject" class="current-project" style="display:none"></div>
  <button class="add-btn" id="addProfile" style="margin-top:0;margin-bottom:10px">+ Add profile for current project</button>

  <div class="tab-content active" data-tab="default">
    <h4>Button order</h4>
    <div class="hint" style="margin-bottom: 6px">Toggle and reorder. Custom jobs in blue.</div>
    <div id="buttonOrder"></div>

    <div class="sep"></div>
    <h4>General</h4>
    <div class="toggle"><input type="checkbox" id="sound_enabled" checked><label for="sound_enabled">Sound notifications</label></div>
    <div class="toggle"><input type="checkbox" id="skip_confirmations"><label for="skip_confirmations">Skip confirmation dialogs</label></div>

    <div class="sep"></div>
    <h4>Reviewers</h4>
    <div class="field">
      <label>Job name</label>
      <input type="text" id="reviewersJob" placeholder="get-reviewers">
      <div class="hint">Pipeline job to trigger if no reviewer comment found</div>
    </div>

    <div class="sep"></div>
    <h4>Custom job buttons</h4>
    <div class="hint" style="margin-bottom: 8px">Use commas to chain: <b>build, deploy</b></div>
    <div id="customJobsList"></div>
    <button class="add-btn" id="addCustomJob">+ Add job button</button>
  </div>

  <button id="save" style="display:none">Save</button>
  <div class="status" id="status">Saved!</div>

  <script src="popup.js"></script>
</body>
</html>
